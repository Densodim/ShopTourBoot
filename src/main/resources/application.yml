spring:
  application:
    name: voyage-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/voyage
    username: voyage
    password: voyage
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Mail is best-effort: password-reset delivery failing does not make the API unable to serve
    # requests. Leaving this on marks the whole service DOWN whenever SMTP is unreachable —
    # permanently so on a dev machine with no local mail server.
    mail:
      enabled: false

voyage:
  mail:
    from: ${VOYAGE_MAIL_FROM:noreply@shoptourr.com}
  client:
    min-android-build: 1
    min-ios-build: 1
    flags:
      export-pdf: true
      ocr-assist: true
      native-maps: false
  media:
    public-base-url: ${VOYAGE_PUBLIC_BASE_URL:http://localhost:8080}
    upload-ttl: 15m
  export:
    public-base-url: ${VOYAGE_PUBLIC_BASE_URL:http://localhost:8080}
    download-ttl: 24h
  idempotency:
    ttl: 24h
  rate-limit:
    enabled: true
    window: 1m
    auth-per-window: 20
    api-per-window: 300
  cors:
    # Local front-end dev servers only — override in deployed environments.
    allowed-origins: ${VOYAGE_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  jwt:
    # HS256 secret — override in prod via VOYAGE_JWT_SECRET (min 32 chars)
    secret: ${VOYAGE_JWT_SECRET:dev-only-change-me-to-a-32byte-secret!!}
    issuer: https://api.shoptourr.com
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  auth:
    reset-token-ttl: 30m
  fx:
    enabled: true
    base-url: ${VOYAGE_FX_BASE_URL:https://open.er-api.com/v6/latest}
    cache-ttl: 1h
  geo:
    enabled: true
    base-url: ${VOYAGE_GEO_BASE_URL:https://nominatim.openstreetmap.org}
    user-agent: ${VOYAGE_GEO_USER_AGENT:ShopTourr/1.0 (https://github.com/Densodim/ShopTourBoot)}
    cache-ttl: 7d

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
